<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrapeGreen — Official Hub</title>
    <link rel="icon" type="image/png" href="https://GrapeGreen-inc.github.io/GrapeGreen/dashboard/site/assets/images/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #2b1055 0%, #4b1d8c 100%);
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }

      .card {
        background-color: #ffffff;
        color: #1f2937;
        max-width: 440px;
        width: 100%;
        padding: 36px 28px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .logo {
        width: 88px;
        height: auto;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0 0 6px 0;
        font-size: 28px;
        color: #3b1470;
      }

      h1 span {
        color: #65a30d;
      }

      .tagline {
        margin: 0 0 16px 0;
        font-size: 14px;
        color: #6b7280;
      }

      .badge {
        display: inline-block;
        background-color: #f3e8ff;
        color: #6b21a8;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 999px;
        margin-bottom: 24px;
      }

      .btn {
        display: block;
        width: 100%;
        padding: 13px 16px;
        margin-bottom: 12px;
        border-radius: 10px;
        border: none;
        text-decoration: none;
        font-family: inherit;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        box-sizing: border-box;
        transition: transform 0.15s ease, background-color 0.15s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        background-color: #65a30d;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(101, 163, 13, 0.3);
      }

      .btn-primary:hover {
        background-color: #4d7c0f;
      }

      .btn-secondary {
        background-color: #f3f4f6;
        color: #374151;
        border: 1px solid #e5e7eb;
      }

      .btn-secondary:hover {
        background-color: #e5e7eb;
      }

      .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #9ca3af;
      }

      /* Fullscreen Markdown Viewer Overlay */
      #viewer {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #f9fafb;
        color: #1f2937;
        z-index: 9999;
        flex-direction: column;
      }

      .viewer-bar {
        background-color: #2b1055;
        color: #ffffff;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid #65a30d;
      }

      .back-btn {
        background-color: #65a30d;
        color: #ffffff;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .back-btn:hover {
        background-color: #4d7c0f;
      }

      #viewer-title {
        font-size: 14px;
        font-weight: 600;
        color: #e9d5ff;
      }

      #doc-content {
        flex: 1;
        overflow-y: auto;
        padding: 32px 24px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        box-sizing: border-box;
        line-height: 1.6;
        text-align: left;
      }

      #doc-content h1, #doc-content h2, #doc-content h3 {
        color: #3b1470;
      }

      #doc-content hr {
        border: none;
        border-top: 1px solid #e5e7eb;
        margin: 24px 0;
      }

      #doc-content a {
        color: #65a30d;
        font-weight: 600;
      }

      #doc-content img {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="https://GrapeGreen-inc.github.io/GrapeGreen/dashboard/site/assets/images/logo.png" alt="GrapeGreen Logo">
      <h1>Grape<span>Green</span></h1>
      <p class="tagline">Your dashboard, your tabs, your memes.</p>
      <div class="badge">Current Build: V1.11 (App+)</div>

      <a class="btn btn-primary" href="https://grapegreen-inc.github.io/GrapeGreen/index.html">🚀 Launch GrapeGreen Dashboard</a>
      <button class="btn btn-secondary" onclick="openViewer('https://GrapeGreen-Inc.github.io/.github/profile/TOS.md', 'Terms of Service (TOS)')">📜 Terms of Service (TOS)</button>
      <button class="btn btn-secondary" onclick="openViewer('https://GrapeGreen-Inc.github.io/.github/profile/README.md', 'Organization README')">🍇 Organization README & Dev Info</button>
      <button class="btn btn-secondary" onclick="openViewer('https://GrapeGreen-Inc.github.io/.github/profile/Update_Log.md', 'Update Log')">📋 Update Log</button>

      <div class="footer">
        © 2026 GrapeGreen, Inc. • All rights reserved.
      </div>
    </div>

    <!-- Fullscreen Markdown Viewer -->
    <div id="viewer">
      <div class="viewer-bar">
        <button class="back-btn" onclick="closeViewer()">← Back to Hub</button>
        <span id="viewer-title">GrapeGreen</span>
        <div style="width: 90px;"></div>
      </div>
      <div id="doc-content">Loading...</div>
    </div>

    <script>
      async function openViewer(url, title) {
        const viewer = document.getElementById('viewer');
        const content = document.getElementById('doc-content');
        document.getElementById('viewer-title').textContent = title;
        content.innerHTML = '<p>Loading document...</p>';
        viewer.style.display = 'flex';
        document.body.style.overflow = 'hidden';

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error('Network error');
          const markdownText = await response.text();
          content.innerHTML = marked.parse(markdownText);
        } catch (error) {
          content.innerHTML = `<p>Could not render preview. <a href="${url}" target="_blank" rel="noopener noreferrer">Open raw file</a></p>`;
        }
      }

      function closeViewer() {
        document.getElementById('viewer').style.display = 'none';
        document.getElementById('doc-content').innerHTML = '';
        document.body.style.overflow = 'auto';
      }
    </script>
  </body>
</html>
