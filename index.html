<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrapeGreen — Official Hub</title>
    <link rel="icon" type="image/png" href="https://github.com">
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #2b1055 0%, #4b1d8c 100%);
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }

      .card {
        background-color: #ffffff;
        color: #1f2937;
        max-width: 440px;
        width: 100%;
        padding: 36px 28px;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .logo {
        width: 88px;
        height: auto;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0 0 6px 0;
        font-size: 28px;
        color: #3b1470;
      }

      h1 span {
        color: #65a30d;
      }

      .tagline {
        margin: 0 0 16px 0;
        font-size: 14px;
        color: #6b7280;
      }

      .badge {
        display: inline-block;
        background-color: #f3e8ff;
        color: #6b21a8;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 999px;
        margin-bottom: 24px;
      }

      .btn {
        display: block;
        width: 100%;
        padding: 13px 16px;
        margin-bottom: 12px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        box-sizing: border-box;
        transition: transform 0.15s ease, background-color 0.15s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        background-color: #65a30d;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(101, 163, 13, 0.3);
      }

      .btn-primary:hover {
        background-color: #4d7c0f;
      }

      .btn-secondary {
        background-color: #f3f4f6;
        color: #374151;
        border: 1px solid #e5e7eb;
      }

      .btn-secondary:hover {
        background-color: #e5e7eb;
      }

      .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="https://github.com" alt="GrapeGreen Logo">
      <h1>Grape<span>Green</span></h1>
      <p class="tagline">Your dashboard, your tabs, your memes.</p>
      <div class="badge">Current Build: V1.11 (App+)</div>

      <a class="btn btn-primary" href="https://grapegreen-inc.github.io/GrapeGreen/index.html">🚀 Launch GrapeGreen Dashboard</a>
      <a class="btn btn-secondary" href="https://GrapeGreen-Inc.github.io/.github/profile/TOS.md" target="_blank" rel="noopener noreferrer">📜 Terms of Service (TOS)</a>
      <a class="btn btn-secondary" href="https://GrapeGreen-Inc.github.io/.github/profile/README.md" target="_blank" rel="noopener noreferrer">🍇 Organization README & Dev Info</a>
      <a class="btn btn-secondary" href="https://GrapeGreen-Inc.github.io/.github/profile/Update_Log.md" target="_blank" rel="noopener noreferrer">📋 Update Log</a>

      <div class="footer">
        © 2026 GrapeGreen, Inc. • All rights reserved.
      </div>
    </div>
  </body>
</html>
